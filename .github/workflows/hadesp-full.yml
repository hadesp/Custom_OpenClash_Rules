name: Verify hadesp Full customization
on:
  push:
    paths: ['cfg/Custom_Clash_Full.ini', 'cfg/yaml/Custom_Clash_Full.yaml', 'rule/Academic_Overseas_No_Google.yaml', 'rule/Google_Scholar.yaml', 'script/check-hadesp-full.py', '.github/workflows/hadesp-full.yml']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: python3 script/check-hadesp-full.py
